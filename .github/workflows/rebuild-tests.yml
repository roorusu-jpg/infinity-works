name: Rebuild regression tests

on:
  push:
    branches: [rebuild-v3]
    paths:
      - "rebuild/**"
      - ".github/workflows/rebuild-tests.yml"
  pull_request:
    branches: [rebuild-v3]
    paths:
      - "rebuild/**"
      - ".github/workflows/rebuild-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
        working-directory: rebuild
